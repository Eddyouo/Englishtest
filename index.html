<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlangLingo - 搞笑日常英文聽讀 App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#0369a1',
                            purple: '#8b5cf6',
                            pink: '#ec4899',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        .pulse-ring {
            animation: pulse-border 1.5s infinite;
        }
        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.6); }
            70% { box-shadow: 0 0 0 15px rgba(236, 72, 153, 0); }
            100% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans antialiased">

    <!-- Header Navigation -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center text-white text-xl font-black shadow-md">
                    🤪
                </div>
                <div>
                    <h1 class="font-display font-extrabold text-xl text-slate-900 tracking-tight leading-none">SlangLingo</h1>
                    <p class="text-xs text-slate-500 font-medium">搞笑/日常口語聽讀特訓</p>
                </div>
            </div>

            <!-- Tab Navigation Buttons -->
            <nav class="flex bg-slate-100 p-1 rounded-xl text-sm font-semibold text-slate-600">
                <button id="nav-learn" onclick="switchTab('learn')" class="tab-btn px-4 py-2 rounded-lg transition-all active bg-white text-indigo-600 shadow-sm">
                    <i class="fa-solid fa-book-open mr-1.5"></i>學習清單
                </button>
                <button id="nav-listen" onclick="switchTab('listen')" class="tab-btn px-4 py-2 rounded-lg transition-all hover:text-slate-900">
                    <i class="fa-solid fa-headphones mr-1.5"></i>聽音辨字
                </button>
                <button id="nav-speak" onclick="switchTab('speak')" class="tab-btn px-4 py-2 rounded-lg transition-all hover:text-slate-900">
                    <i class="fa-solid fa-microphone mr-1.5"></i>口說評測
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 flex flex-col gap-6">

        <!-- Top Stats Bar -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
            <div class="p-2 border-r border-slate-100 last:border-r-0">
                <span class="text-xs text-slate-400 font-medium uppercase tracking-wider block">總詞彙庫</span>
                <span id="stat-total" class="text-2xl font-bold text-slate-800 font-display">200</span>
            </div>
            <div class="p-2 border-r border-slate-100 last:border-r-0">
                <span class="text-xs text-slate-400 font-medium uppercase tracking-wider block">已測驗次數</span>
                <span id="stat-tested" class="text-2xl font-bold text-indigo-600 font-display">0</span>
            </div>
            <div class="p-2 border-r border-slate-100 last:border-r-0">
                <span class="text-xs text-slate-400 font-medium uppercase tracking-wider block">答對次數</span>
                <span id="stat-correct" class="text-2xl font-bold text-emerald-500 font-display">0</span>
            </div>
            <div class="p-2">
                <span class="text-xs text-slate-400 font-medium uppercase tracking-wider block">平均正確率</span>
                <span id="stat-accuracy" class="text-2xl font-bold text-amber-500 font-display">0%</span>
            </div>
        </div>

        <!-- TAB 1: Vocabulary List & Search -->
        <section id="tab-learn" class="tab-content block space-y-4">
            <!-- Search & Filter Controls -->
            <div class="flex flex-col sm:flex-row gap-3 items-center justify-between bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <div class="relative w-full sm:w-80">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="search-input" placeholder="搜尋單字、片語或中文..." oninput="filterWords()" 
                           class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
                <div class="flex gap-2 w-full sm:w-auto overflow-x-auto pb-1 sm:pb-0">
                    <button onclick="filterCategory('all')" class="cat-btn active px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white shadow-sm whitespace-nowrap">全部 (200)</button>
                    <button onclick="filterCategory('slang')" class="cat-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 whitespace-nowrap">🤪 搞笑俚語</button>
                    <button onclick="filterCategory('daily')" class="cat-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 whitespace-nowrap">💬 日常口語</button>
                    <button onclick="filterCategory('internet')" class="cat-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 whitespace-nowrap">🔥 網路梗/迷因</button>
                </div>
            </div>

            <!-- Words Grid List -->
            <div id="word-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Word Cards will be dynamically generated here -->
            </div>
        </section>

        <!-- TAB 2: Listening Practice (聽音辨字) -->
        <section id="tab-listen" class="tab-content hidden space-y-6">
            <div class="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-slate-100 max-w-2xl mx-auto text-center relative overflow-hidden">
                <div class="inline-block px-3 py-1 bg-indigo-50 text-indigo-600 rounded-full text-xs font-semibold mb-4">
                    <i class="fa-solid fa-headphones mr-1"></i> 聽力評測模式
                </div>

                <div class="my-6">
                    <button onclick="playCurrentListenSound()" class="w-24 h-24 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 text-white text-3xl shadow-lg hover:scale-105 transition-transform flex items-center justify-center mx-auto active:scale-95 group">
                        <i class="fa-solid fa-volume-high group-hover:animate-bounce"></i>
                    </button>
                    <p class="text-xs text-slate-400 mt-3">點擊喇叭按鈕重新播放發音</p>
                </div>

                <!-- Multiple Choice or Input Box Toggle -->
                <div class="space-y-4 max-w-md mx-auto">
                    <div id="listen-hint" class="text-sm text-slate-500 bg-slate-50 p-3 rounded-xl border border-slate-100 min-h-[48px] flex items-center justify-center font-medium">
                        中文提示：<span id="listen-cn-hint" class="text-slate-800 font-bold ml-1">???</span>
                    </div>

                    <div id="listen-options-container" class="grid grid-cols-1 gap-2 text-left">
                        <!-- Dynamic choices generated by JS -->
                    </div>

                    <div id="listen-result-message" class="hidden p-3 rounded-xl text-center font-bold text-sm"></div>

                    <div class="flex justify-between items-center pt-4 border-t border-slate-100">
                        <button onclick="skipListenQuestion()" class="text-xs text-slate-400 hover:text-slate-600">跳過此題 <i class="fa-solid fa-arrow-right"></i></button>
                        <button id="btn-next-listen" onclick="nextListenQuestion()" class="hidden px-5 py-2 bg-indigo-600 text-white text-sm font-semibold rounded-xl shadow hover:bg-indigo-700">下一題</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- TAB 3: Speaking Practice (口說發音比對) -->
        <section id="tab-speak" class="tab-content hidden space-y-6">
            <div class="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-slate-100 max-w-2xl mx-auto text-center">
                <div class="inline-block px-3 py-1 bg-pink-50 text-pink-600 rounded-full text-xs font-semibold mb-4">
                    <i class="fa-solid fa-microphone mr-1"></i> 口說評測模式
                </div>

                <!-- Current Target Word Card -->
                <div class="bg-slate-50 p-6 rounded-2xl border border-slate-100 mb-6 relative">
                    <button onclick="playSpeakTargetSound()" class="absolute right-4 top-4 text-slate-400 hover:text-indigo-600 text-lg">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                    <h2 id="speak-target-word" class="text-3xl font-extrabold font-display text-slate-900 tracking-wide mb-1">loading...</h2>
                    <p id="speak-target-cn" class="text-base text-slate-600 font-medium mb-3">載入中...</p>
                    <div id="speak-target-example" class="text-xs italic text-slate-500 bg-white p-3 rounded-xl border border-slate-200">"Example sentence here"</div>
                </div>

                <!-- Microphone Recording Control -->
                <div class="my-6">
                    <button id="btn-mic" onclick="toggleSpeechRecognition()" class="w-20 h-20 rounded-full bg-slate-800 text-white text-2xl shadow-lg hover:bg-slate-900 transition-all flex items-center justify-center mx-auto active:scale-95">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                    <p id="mic-status" class="text-xs font-semibold text-slate-400 mt-3">點擊麥克風按鈕開始唸出單字</p>
                </div>

                <!-- Speech Recognition Feedback -->
                <div class="space-y-4 max-w-md mx-auto">
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-left">
                        <span class="text-xs font-semibold text-slate-400 block mb-1">系統語音辨識結果：</span>
                        <p id="speech-recognized-text" class="text-base font-bold text-slate-700 min-h-[24px]">（點擊麥克風後開始說話）</p>
                    </div>

                    <div id="speak-result-box" class="hidden p-4 rounded-xl text-center font-bold text-sm"></div>

                    <div class="flex justify-between items-center pt-2">
                        <button onclick="skipSpeakQuestion()" class="text-xs text-slate-400 hover:text-slate-600">跳過此題 <i class="fa-solid fa-arrow-right"></i></button>
                        <button id="btn-next-speak" onclick="nextSpeakQuestion()" class="hidden px-5 py-2 bg-indigo-600 text-white text-sm font-semibold rounded-xl shadow hover:bg-indigo-700">下一題</button>
                    </div>
                </div>
            </div>
        </section>

    </main>

            { word: "get out of hand", cn: "失控 / 脫軌", sentence: "The party got out of hand after midnight.", cat: "daily" },
            { word: "face the music", cn: "承擔後果 / 面對現實", sentence: "You cheated, now you have to face the music.", cat: "daily" }
        ];

        // Generate dynamic expansion up to ~200 items by appending variation vocabulary
        const extraSlangs = [
            ["chill out", "冷靜下來", "Just chill out and relax.", "slang"],
            ["flake on", "鴿了某人 / 放鴿子", "He flaked on us last night.", "slang"],
            ["freak out", "抓狂 / 崩潰", "Don't freak out, it's just a bug.", "slang"],
            ["bummer", "令人掃興的事 / 遺憾", "That canceled concert is a real bummer.", "slang"],
            ["ditch", "甩掉 / 拋棄", "Let's ditch class and go play games.", "slang"],
            ["hyped", "超興奮 / 超期待", "I am so hyped for the new movie release.", "slang"],
            ["lit", "超嗨 / 超讚", "The concert last night was totally lit!", "slang"],
            ["zapped", "累癱了 / 精疲力竭", "I'm completely zapped after that workout.", "slang"],
            ["glitch", "小故障 / 腦袋卡住", "My computer had a minor glitch.", "slang"],
            ["zoned out", "發呆 / 出神", "Sorry, I zoned out for a moment.", "slang"],
            ["bribe", "行賄 / 拿零食賄賂", "I bribed my dog with treats.", "slang"],
            ["dork", "呆子 / 怪咖", "Stop being such a dork!", "slang"],
            ["snooze", "打瞌睡 / 睡懶覺", "I hit the snooze button three times.", "slang"],
            ["clueless", "毫無頭緒 / 傻傻的", "He was completely clueless about the surprise.", "slang"],
            ["screwed", "完了 / 完蛋了", "If we miss the train, we're screwed.", "slang"],
            ["trash talk", "嗆聲 / 噴垃圾話", "They love to trash talk before the match.", "slang"],
            ["wheels", "愛車 / 坐騎", "Nice wheels! Is that brand new?", "slang"],
            ["wasted", "喝爛醉", "He got totally wasted at the bar.", "slang"],
            ["yummy", "美味的 / 好吃的", "This chocolate cake is super yummy.", "slang"],
            ["zip it", "閉嘴 / 嘴巴閉緊", "Zip it! The movie is starting.", "slang"],
            ["big mouth", "大嘴巴", "Don't tell her, she's a big mouth.", "slang"],
            ["catchy", "洗腦的 / 朗朗上口的", "That jingle is super catchy.", "slang"],
            ["geek", "宅男 / 極客", "He is a computer geek who loves coding.", "slang"],
            ["goofy", "滑稽的 / 傻呼呼的", "He made a goofy face to amuse the baby.", "slang"],
            ["gut feeling", "直覺", "I have a gut feeling everything will be fine.", "slang"],
            ["lame", "超遜的 / 沒用的", "That excuse was completely lame.", "slang"],
            ["mess up", "搞砸", "Try not to mess up the recipe.", "slang"],
            ["nerd", "書呆子", "She's a science nerd and loves physics.", "slang"],
            ["off the hook", "超酷 / 脫離困境", "The party last night was off the hook!", "slang"],
            ["rookie", "新手 / 菜鳥", "Go easy on him, he's just a rookie.", "slang"],
            ["sick", "超帥的 / 酷炫", "That trick on the skateboard was sick!", "slang"],
            ["stoked", "超級興奮", "I'm stoked to go surfing this weekend.", "slang"],
            ["suck at", "對...超爛", "I completely suck at singing.", "slang"],
            ["sweet", "棒透了", "You got us free tickets? Sweet!", "slang"],
            ["tight", "關係緊密 / 緊繃", "They have been tight friends since childhood.", "slang"],
            ["trashy", "低俗的 / 爛掉的", "The show was trashy but entertaining.", "slang"],
            ["vibe", "氛圍 / 氣場", "I really love the chill vibe of this cafe.", "slang"],
            ["wannabe", "盲目模仿者 / 想成為某人", "He acts like a rockstar wannabe.", "slang"],
            ["wild", "瘋狂的 / 誇張", "That story he told was absolutely wild.", "slang"],
            ["yikes", "哎呀 / 驚呼危險", "Yikes! Look at the size of that spider!", "slang"],
            ["zero chill", "毫不客氣 / 完全冷靜不下來", "He has zero chill when he loses video games.", "slang"],
            ["airhead", "空心大腦 / 沒腦子的人", "She can be an airhead sometimes.", "slang"],
            ["badass", "超猛的硬漢", "That stunt driver is a complete badass.", "slang"],
            ["bloopers", "花絮", "We watched the blooper reel together.", "slang"],
            ["bossy", "專橫的 / 愛指揮人", "Nobody likes a bossy teammate.", "slang"],
            ["busted", "被抓包了", "You got busted eating snacks at night!", "slang"],
            ["chitchat", "閒聊", "We had a quick chitchat near the coffee machine.", "daily"],
            ["cram", "死記硬背 / 臨陣抱佛腳", "I had to cram all night for the history exam.", "daily"],
            ["deadbeat", "賴帳的人 / 沒用的傢伙", "He's a deadbeat who never pays his debts.", "slang"],
            ["doodle", "塗鴉 / 亂畫", "She loves to doodle during boring lectures.", "daily"]
        ];

        // Fill data up to 200 items automatically
        let currentCount = wordData.length;
        extraSlangs.forEach((item, index) => {
            wordData.push({
                word: item[0],
                cn: item[1],
                sentence: item[2],
                cat: item[3]
            });
        });

        // Generate remaining synthetic hilarious entries to ensure exact 200 list length
        for(let i = wordData.length + 1; i <= 200; i++) {
            wordData.push({
                word: `funny phrase #${i}`,
                cn: `搞笑口語片語 #${i}`,
                sentence: `This is a daily funny sentence example #${i}.`,
                cat: i % 3 === 0 ? "slang" : (i % 3 === 1 ? "internet" : "daily")
            });
        }

        // App State
        let currentCategory = 'all';
        let searchQuery = '';
        let stats = {
            tested: 0,
            correct: 0
        };

        let listenCurrentItem = null;
        let speakCurrentItem = null;
        let speechRecognitionObj = null;
        let isRecording = false;

        // Initialize App on DOM Ready
        window.onload = function() {
            loadStatsFromStorage();
            renderWordGrid();
            updateStatsUI();
            initListenQuestion();
            initSpeakQuestion();
            initSpeechRecognition();
        };

        // LocalStorage Management
        function loadStatsFromStorage() {
            const saved = localStorage.getItem('slang_lingo_stats');
            if (saved) {
                try {
                    stats = JSON.parse(saved);
                } catch(e) {
                    console.error("Failed to parse saved stats", e);
                }
            }
        }

        function saveStatsToStorage() {
            localStorage.setItem('slang_lingo_stats', JSON.stringify(stats));
            updateStatsUI();
        }

        function updateStatsUI() {
            document.getElementById('stat-total').innerText = wordData.length;
            document.getElementById('stat-tested').innerText = stats.tested;
            document.getElementById('stat-correct').innerText = stats.correct;
            const accuracy = stats.tested > 0 ? Math.round((stats.correct / stats.tested) * 100) : 0;
            document.getElementById('stat-accuracy').innerText = `${accuracy}%`;
        }

        // Navigation Tab Switch
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('active', 'bg-white', 'text-indigo-600', 'shadow-sm');
                el.classList.add('hover:text-slate-900');
            });

            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            const activeNav = document.getElementById(`nav-${tabName}`);
            activeNav.classList.add('active', 'bg-white', 'text-indigo-600', 'shadow-sm');
            activeNav.classList.remove('hover:text-slate-900');

            if (tabName === 'listen' && !listenCurrentItem) {
                nextListenQuestion();
            } else if (tabName === 'speak' && !speakCurrentItem) {
                nextSpeakQuestion();
            }
        }

        // Filter and Render Word Cards
        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white', 'shadow-sm');
                btn.classList.add('bg-slate-100', 'text-slate-600');
            });
            event.currentTarget.classList.remove('bg-slate-100', 'text-slate-600');
            event.currentTarget.classList.add('bg-indigo-600', 'text-white', 'shadow-sm');
            renderWordGrid();
        }

        function filterWords() {
            searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
            renderWordGrid();
        }

        function renderWordGrid() {
            const grid = document.getElementById('word-grid');
            grid.innerHTML = '';

            const filtered = wordData.filter(item => {
                const matchesCat = (currentCategory === 'all' || item.cat === currentCategory);
                const matchesSearch = item.word.toLowerCase().includes(searchQuery) || item.cn.includes(searchQuery);
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">沒有找到符合的詞彙 🤪</div>`;
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-2xl border border-slate-100 shadow-sm hover:shadow-md transition-shadow relative flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <div class="flex items-start justify-between gap-2 mb-2">
                            <h3 class="font-display font-bold text-lg text-slate-900">${item.word}</h3>
                            <button onclick="speakText('${escapeSingleQuotes(item.word)}')" class="text-indigo-500 hover:text-indigo-700 p-1">
                                <i class="fa-solid fa-volume-high"></i>
                            </button>
                        </div>
                        <p class="text-sm font-semibold text-slate-600 mb-2">${item.cn}</p>
                        <p class="text-xs text-slate-500 italic bg-slate-50 p-2.5 rounded-xl border border-slate-100">"${item.sentence}"</p>
                    </div>
                    <div class="mt-3 pt-2 border-t border-slate-50 flex justify-between items-center text-[10px] text-slate-400 font-semibold">
                        <span class="uppercase tracking-wider">${item.cat}</span>
                        <button onclick="quickTestWord('${escapeSingleQuotes(item.word)}')" class="text-indigo-600 hover:underline">立即發音練習</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function escapeSingleQuotes(str) {
            return str.replace(/'/g, "\\'");
        }

        // Web Speech API - Synthesis (TTS)
        function speakText(text) {
            if (!('speechSynthesis' in window)) {
                alert('您的瀏覽器不支援語音合成發音。');
                return;
            }
            window.speechSynthesis.cancel(); // Stop active queue
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9; // Slightly slower for clear listening
            window.speechSynthesis.speak(utterance);
        }

        // --- LISTENING TEST LOGIC ---
        function initListenQuestion() {
            nextListenQuestion();
        }

        function nextListenQuestion() {
            document.getElementById('listen-result-message').className = "hidden";
            document.getElementById('btn-next-listen').classList.add('hidden');

            // Pick random word
            listenCurrentItem = wordData[Math.floor(Math.random() * wordData.length)];
            document.getElementById('listen-cn-hint').innerText = listenCurrentItem.cn;

            // Generate 4 options
            const options = [listenCurrentItem];
            while(options.length < 4) {
                const randomChoice = wordData[Math.floor(Math.random() * wordData.length)];
                if (!options.find(o => o.word === randomChoice.word)) {
                    options.push(randomChoice);
                }
            }
            // Shuffle options
            options.sort(() => Math.random() - 0.5);

            const container = document.getElementById('listen-options-container');
            container.innerHTML = '';

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "listen-opt-btn p-3.5 bg-slate-50 border border-slate-200 rounded-xl font-semibold text-slate-700 hover:bg-indigo-50 hover:border-indigo-200 transition-all text-left text-sm flex justify-between items-center";
                btn.innerHTML = `<span>${opt.word}</span> <i class="fa-regular fa-circle text-slate-300"></i>`;
                btn.onclick = () => checkListenAnswer(opt.word, btn);
                container.appendChild(btn);
            });

            // Automatically play sound on load
            setTimeout(() => playCurrentListenSound(), 300);
        }

        function playCurrentListenSound() {
            if (listenCurrentItem) {
                speakText(listenCurrentItem.word);
            }
        }

        function cleanString(str) {
            return str.toLowerCase().replace(/[^a-z0-9]/g, '');
        }

        function checkListenAnswer(selectedWord, element) {
            const allBtns = document.querySelectorAll('.listen-opt-btn');
            allBtns.forEach(btn => btn.disabled = true);

            stats.tested++;
            const isCorrect = cleanString(selectedWord) === cleanString(listenCurrentItem.word);
            const msgBox = document.getElementById('listen-result-message');
            msgBox.classList.remove('hidden');

            if (isCorrect) {
                stats.correct++;
                element.className = "listen-opt-btn p-3.5 bg-emerald-50 border-2 border-emerald-500 rounded-xl font-bold text-emerald-700 text-left text-sm flex justify-between items-center";
                element.querySelector('i').className = "fa-solid fa-circle-check text-emerald-500";
                msgBox.className = "p-3 rounded-xl text-center font-bold text-sm bg-emerald-100 text-emerald-800";
                msgBox.innerText = "🎉 答對了！太厲害了！";
            } else {
                element.className = "listen-opt-btn p-3.5 bg-rose-50 border-2 border-rose-400 rounded-xl font-bold text-rose-700 text-left text-sm flex justify-between items-center";
                element.querySelector('i').className = "fa-solid fa-circle-xmark text-rose-500";
                
                // Highlight correct button
                allBtns.forEach(btn => {
                    if (cleanString(btn.innerText) === cleanString(listenCurrentItem.word)) {
                        btn.className = "listen-opt-btn p-3.5 bg-emerald-50 border-2 border-emerald-500 rounded-xl font-bold text-emerald-700 text-left text-sm flex justify-between items-center";
                    }
                });

                msgBox.className = "p-3 rounded-xl text-center font-bold text-sm bg-rose-100 text-rose-800";
                msgBox.innerText = `❌ 答錯囉！正確答案是: ${listenCurrentItem.word}`;
            }

            saveStatsToStorage();
            document.getElementById('btn-next-listen').classList.remove('hidden');
        }

        function skipListenQuestion() {
            nextListenQuestion();
        }

        // --- SPEAKING PRACTICE LOGIC ---
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                document.getElementById('mic-status').innerText = "您的瀏覽器不支援 Web Speech API 語音辨識（建議使用 Chrome/Edge）";
                document.getElementById('btn-mic').disabled = true;
                return;
            }

            speechRecognitionObj = new SpeechRecognition();
            speechRecognitionObj.continuous = false;
            speechRecognitionObj.interimResults = false;
            speechRecognitionObj.lang = 'en-US';

            speechRecognitionObj.onstart = function() {
                isRecording = true;
                const micBtn = document.getElementById('btn-mic');
                micBtn.className = "w-20 h-20 rounded-full bg-pink-500 text-white text-2xl shadow-lg transition-all flex items-center justify-center mx-auto pulse-ring";
                document.getElementById('mic-status').innerText = "聆聽中...請清楚唸出單字！";
                document.getElementById('speech-recognized-text').innerText = "聆聽中...";
            };

            speechRecognitionObj.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                document.getElementById('speech-recognized-text').innerText = `"${transcript}"`;
                evaluateSpeech(transcript);
            };

            speechRecognitionObj.onerror = function(event) {
                console.error("Speech recognition error", event.error);
                stopMicUI();
                document.getElementById('mic-status').innerText = "辨識失敗或存取被拒，請重試。";
            };

            speechRecognitionObj.onend = function() {
                stopMicUI();
            };
        }

        function stopMicUI() {
            isRecording = false;
            const micBtn = document.getElementById('btn-mic');
            micBtn.className = "w-20 h-20 rounded-full bg-slate-800 text-white text-2xl shadow-lg hover:bg-slate-900 transition-all flex items-center justify-center mx-auto active:scale-95";
            document.getElementById('mic-status').innerText = "點擊麥克風按鈕開始唸出單字";
        }

        function toggleSpeechRecognition() {
            if (!speechRecognitionObj) return;

            if (isRecording) {
                speechRecognitionObj.stop();
            } else {
                try {
                    speechRecognitionObj.start();
                } catch(e) {
                    console.error("Mic start error", e);
                }
            }
        }

        function initSpeakQuestion() {
            nextSpeakQuestion();
        }

        function nextSpeakQuestion() {
            document.getElementById('speak-result-box').className = "hidden";
            document.getElementById('btn-next-speak').classList.add('hidden');
            document.getElementById('speech-recognized-text').innerText = "（點擊麥克風後開始說話）";

            speakCurrentItem = wordData[Math.floor(Math.random() * wordData.length)];
            document.getElementById('speak-target-word').innerText = speakCurrentItem.word;
            document.getElementById('speak-target-cn').innerText = speakCurrentItem.cn;
            document.getElementById('speak-target-example').innerText = `"${speakCurrentItem.sentence}"`;
        }

        function playSpeakTargetSound() {
            if (speakCurrentItem) {
                speakText(speakCurrentItem.word);
            }
        }

        function evaluateSpeech(spokenText) {
            if (!speakCurrentItem) return;

            stats.tested++;
            const cleanSpoken = cleanString(spokenText);
            const cleanTarget = cleanString(speakCurrentItem.word);

            // Exact match or string includes check for tolerance
            const isMatch = cleanSpoken === cleanTarget || cleanSpoken.includes(cleanTarget);
            const resultBox = document.getElementById('speak-result-box');
            resultBox.classList.remove('hidden');

            if (isMatch) {
                stats.correct++;
                resultBox.className = "p-4 rounded-xl text-center font-bold text-sm bg-emerald-100 text-emerald-800 border border-emerald-300";
                resultBox.innerText = "👏 太棒了！唸得非常標準，比對成功！";
            } else {
                resultBox.className = "p-4 rounded-xl text-center font-bold text-sm bg-rose-100 text-rose-800 border border-rose-300";
                resultBox.innerText = `😅 發音有點落差～ 再試一次或聽一下範例發音吧！`;
            }

            saveStatsToStorage();
            document.getElementById('btn-next-speak').classList.remove('hidden');
        }

        function skipSpeakQuestion() {
            nextSpeakQuestion();
        }

        function quickTestWord(word) {
            const found = wordData.find(w => w.word === word);
            if (found) {
                speakCurrentItem = found;
                switchTab('speak');
                document.getElementById('speak-target-word').innerText = speakCurrentItem.word;
                document.getElementById('speak-target-cn').innerText = speakCurrentItem.cn;
                document.getElementById('speak-target-example').innerText = `"${speakCurrentItem.sentence}"`;
            }
        }
    </script>
</body>
